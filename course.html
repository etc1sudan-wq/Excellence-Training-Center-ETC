<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ETC Program</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="nav"><a class="brand" href="index.html"><span>ETC</span><div><b>Excellence Training Center</b><small>Program</small></div></a><a class="btn light" href="index.html#register">Register</a></header>
<main class="course-page"><p class="eyebrow">ETC PROGRAM</p><h1 id="title">Program</h1><p id="description" class="lead"></p><div id="courseLessons" class="lesson-grid"></div></main><script type="module">
import {loadLessons} from './app.js';
const data={english:["General English","Pre-1, Pre-2 and A1–C2 with the four skills and speaking practice."],ielts:["IELTS Preparation","Structured support for listening, reading, writing and speaking."],phonics:["Jolly Phonics","Phonics and early English literacy for young learners."],computer:["Computer & AI Skills","Practical Word, Excel, information management and AI skills."],curriculum:["International Curriculum","English, Mathematics, Science and ICT support."],development:["Human Development","Communication, leadership and practical soft skills."]};
const id=new URLSearchParams(location.search).get('id')||'english';const x=data[id]||data.english;document.title=x[0]+' | ETC';document.querySelector('#title').textContent=x[0];document.querySelector('#description').textContent=x[1];
const lessons=await loadLessons();document.querySelector('#courseLessons').innerHTML=lessons.filter(l=>!l.course||l.course.toLowerCase().includes(id)||id==='english'&&l.course==='').map(l=>`<article class="lesson"><label>${l.level||'ETC LESSON'}</label><h3>${l.title}</h3><p>${l.description||''}</p>${l.video_url?`<a href="${l.video_url}" target="_blank">Watch lesson →</a>`:''}${l.pdf_url?`<a href="${l.pdf_url}" target="_blank">Open PDF →</a>`:''}</article>`).join('')||'<p>No lessons have been published for this program yet.</p>';
</script></body></html>
